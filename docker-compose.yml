services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: Her-connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MosesAlier2023
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
